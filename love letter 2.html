<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Love letter for crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="love letter 2.css" />
  </head>
  <body>
    <!--  -->
    <div class="top-wrapper">
      <h1>Hey baby!</h1>
    </div>

    <div class="pictures-wrapper">
      <h1>Pictures Scroll</h1>

      <div class="masonry-layout">
        <div class="gallery-container">
          <!-- Gallery Items -->
          <div
            style="background-image: url(pictures/7.jpg)"
            class="gallery-item size-col-2x size-row-2x"
          >
            <div class="inner-content">
              <h2>Item title one</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/2.png)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Item title two</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/4.png)"
            class="gallery-item size-row-2x"
          >
            <div class="inner-content">
              <h2>Item title three</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/3.png)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Item title four</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/5.png)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Item title five</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/6.png)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Item title six</h2>
              <a href="#">Read More</a>
            </div>
          </div>
          <div
            style="background-image: url(pictures/1.png)"
            class="gallery-item size-col-2x"
          >
            <div class="inner-content">
              <h2>Item title seven</h2>
              <a href="#">Read More</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- tiktok meowish -->
    <div class="envlope-wrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line1">To: Crush</div>
          <div class="words line2">Dear crush, my beautiful baby</div>
          <div class="words line3">Will you be my Valentine?</div>
          <div class="words line4">Yes or No</div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
      </div>
    </div>
    <div class="reset">
      <button id="open">Open</button>
      <button id="reset">Close</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="love letter 2.js"></script>
  </body>
</html>
