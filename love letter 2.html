<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Love letter for crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="love letter 2.css" />
  </head>
  <body>
    <div class="top-wrapper">
      <div class="floating-hearts">
        <div class="css-heart"></div>
        <div class="css-heart"></div>
        <div class="css-heart"></div>
        <div class="css-heart"></div>
        <div class="css-heart"></div>
      </div>
      <img
        class="big-icon"
        src="pictures/bear-flower.gif"
        alt="flowers for you"
      />
      <h1 class="first-text">Hey baby Yana!</h1>
    </div>

    <div class="pictures-wrapper">
      <h1 class="second-text">Our Cute Gallery!</h1>

      <div class="masonry-layout">
        <div class="gallery-container">
          <!-- Gallery Items -->
          <div
            style="background-image: url(pictures/7new.jpg)"
            class="gallery-item size-col-2x size-row-2x"
          >
            <div class="inner-content">
              <h2>"How sweet!"</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/2new.jpg)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Cutie #1</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/4new.jpg)"
            class="gallery-item size-row-2x"
          >
            <div class="inner-content">
              <h2>The Cutest Baby</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/3new.jpg)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Cutie #2</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/5new.jpg)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Datee!</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/6new.jpg)"
            class="gallery-item"
          >
            <div class="inner-content">
              <h2>Anotherrr Date!</h2>
            </div>
          </div>
          <div
            style="background-image: url(pictures/1new.jpg)"
            class="gallery-item size-col-2x"
          >
            <div class="inner-content">
              <h2>WOW! ANOTHER DATE!</h2>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- tiktok meowish -->
    <div class="envlope-wrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line1">To: Crush</div>
          <div class="words line2">Dear crush, my beautiful baby</div>
          <div class="words line3">Will you be my Valentine?</div>
          <div class="words line4">Yes or No</div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
      </div>
    </div>
    <div class="reset">
      <button id="open">Open</button>
      <button id="reset">Close</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="love letter 2.js"></script>

    <div class="bottom-wrapper">
      <img
        id="decision-image"
        src="pictures/question.gif"
        alt="Valentine question"
      />

      <h2 id="decision-text">Will you be my Valentine?</h2>

      <div class="buttons">
        <button id="yes-button">Yes</button>
        <button id="no-button">No</button>
      </div>
    </div>
  </body>
</html>
